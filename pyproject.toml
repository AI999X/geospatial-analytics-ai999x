[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-analytics-ai999x"
version = "1.0.3"
description = "Offline geospatial analytics solver: ellipsoidal geodesy, coordinate conversions and map projections, spatial statistics and geostatistics, remote-sensing indices, terrain analysis, and urban and network analysis, with steps, LaTeX and honest refusals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ibnul Jaif Farabi"}]
maintainers = [{name = "AI999X"}]
keywords = ["geospatial analytics", "GIS", "geodesy", "geodesic", "ellipsoid", "WGS84", "UTM", "map projection", "Mercator", "Lambert conformal conic", "Albers", "coordinate conversion", "ECEF", "spatial statistics", "Moran's I", "Getis-Ord", "kriging", "variogram", "kernel density", "NDVI", "remote sensing", "terrain analysis", "slope aspect", "flow accumulation", "network analysis", "accessibility", "facility location", "segregation index", "ai999x", "offline", "cpu", "stem", "education", "step-by-step", "latex", "solver"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Intended Audience :: Developers", "Topic :: Scientific/Engineering", "Topic :: Education", "Development Status :: 5 - Production/Stable"]
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
search = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
plot = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]
reader = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]

[project.scripts]
geospatial-analytics-ai999x = "geospatial_analytics_ai999x.cli:main"

[project.urls]
"Source" = "https://github.com/AI999X/geospatial-analytics-ai999x"
"Issues" = "https://github.com/AI999X/geospatial-analytics-ai999x/issues"
"Homepage" = "https://ai999x.com"
"Hugging Face" = "https://huggingface.co/AI999X/geospatial-analytics-ai999x"
"Funding" = "https://buymeacoffee.com/ibnuljaiffarabi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geospatial_analytics_ai999x = ["pack/*.json", "pack/*/*.json", "pack/*.sqlite", "pack/capabilities/*.py", "pack/search/*.onnx", "pack/reader/*.onnx"]
